global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: job-manager
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['job-manager:8080']

  - job_name: job-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['worker-1:8081', 'worker-2:8081', 'worker-3:8081']

  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: ['queue_coarse_metrics']
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
